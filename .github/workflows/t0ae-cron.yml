name: T0AE XBI Signals

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run-t0ae:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run T0AE main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          OPENAI_MODEL: "gpt-4.1-mini"
          MIN_CONFIDENCE: "0.6"
          MIN_EXPECTED_MOVE: "0.7"
          FDA_LOOKBACK_HOURS: "2"
        run: |
          python -m src.main
